name: Refresh npm lockfile

on:
  push:
    branches:
      - security/modernize-node-toolchain-2026

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate a clean lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build static assets
        run: npm run build

      - name: Commit refreshed lockfile and generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json css/styles.css js/scripts.min.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate secure npm lockfile"
            git push
          fi
